[agent]
kind = "command"
command = "sh agent.sh"
prompt = "Speed up log aggregation while preserving the evaluator's correctness contract."

[evaluate]
command = "sh eval.sh"
goal = "min"
protected = ["eval.sh", "tests.rs", "bench.rs", "agent.sh", "candidates"]
confirm_top = 2
confirm_reps = 3
remeasure_root = true

[explore]
budget = 3

[dream]
mode = "strict"
holdout = 1
